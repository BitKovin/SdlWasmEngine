<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xml:space="preserve">
  <!-- Chain line connecting existing nodes -->
  <line x1="20" y1="64" x2="80" y2="64" stroke="#C0C0C0" stroke-width="5" stroke-dasharray="10,6"/>
  <!-- Existing node 1 (left) -->
  <circle cx="20" cy="64" r="10" fill="none" stroke="#C0C0C0" stroke-width="5"/>
  <!-- Existing node 2 (middle) -->
  <circle cx="64" cy="64" r="10" fill="none" stroke="#C0C0C0" stroke-width="5"/>
  <!-- Line to new node -->
  <line x1="74" y1="64" x2="104" y2="36" stroke="#C0C0C0" stroke-width="5" stroke-dasharray="10,6"/>
  <!-- New node being placed (highlighted) -->
  <circle cx="108" cy="32" r="12" fill="none" stroke="#3EB33E" stroke-width="6"/>
  <!-- Plus sign inside new node -->
  <line x1="108" y1="24" x2="108" y2="40" stroke="#3EB33E" stroke-width="4"/>
  <line x1="100" y1="32" x2="116" y2="32" stroke="#3EB33E" stroke-width="4"/>
</svg>
